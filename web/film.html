  vertexShader:`attribute vec3 aV;uniform float uT,uPx;varying float vA;void main(){vec3 p=position+aV*uT;p.x=mod(p.x+3.,6.)-3.;p.y=mod(p.y+2.,4.)-2.;

// 程序生成大腦：橢球＋皺摺場（零值等高線＝腦溝）＋左右半球中縫
function brainShape(x,y,z){
  const wx=x*3.4+.8*Math.sin(y*3.9+1.3),wy=y*3.4+.8*Math.sin(z*4.2+.7),wz=z*3.4+.8*Math.sin(x*3.7+2.1);

  const groove=Math.exp(-Math.pow(z/.07,2))*sstep(-.25,.15,y);
  gy*=1-groove*.9;
  const r=1+.1*gy-.24*groove-.05*Math.exp(-Math.pow((y+.18-.25*x)/.06,2))*sstep(-.1,.3,Math.abs(z));  // 外側裂
  let X=x*1.18*r,Y=y*.86*r,Z=z*.98*r*(1-.1*Math.max(0,x));if(Y<0)Y*=.72;

  let x=rnd()*2-1,y=rnd()*2-1,z=rnd()*2-1;const l=Math.hypot(x,y,z);if(l>1||l<.05)continue;x/=l;y/=l;z/=l;

// 39.17°N 195.61°E 轉到正面（+z，朝鏡頭）

/* ---------- 鏡頭：每段一個 shot，交界用「目標線性、距離取對數」平順混合 ---------- */

const fmtN=n=>Math.round(n).toLocaleString('en-US');

  aoiLine.material.opacity=.8*(1-sstep(14,15.5,T));
  baseGlow.material.opacity=sstep(8.6,9.2,T)*(1-sstep(15,16.5,T))+sstep(20.2,21,T)*.8;
  for(const o of tgtObjs){const v=sstep(o.t0,o.t0+.3,T)*(1-sstep(18,19,T));o.pm.uniforms.uOp.value=v*.9*(1-sstep(16.6,17.6,T));o.rm.opacity=v*.9+(o.onRoute?.75*sstep(20.6,21.2,T):0)}
  // 第 3 幕：路線畫出 → 低空跟拍 → 拉高
  astroAll.uniforms.uT.value=ramp(20.4,21.5,T);astroAll.uniforms.uOp.value=.75*sstep(20.3,20.6,T);
  const d=followD(T),r=routeAt(d);
  astroTrail.uniforms.uT.value=T>=21.8?d/TOTD+1e-4:0;astroTrail.uniforms.uOp.value=sstep(21.6,21.9,T);
  walker.position.copy(W3(r.x,r.y,18));walker.material.opacity=sstep(21.4,21.9,T)*(1-sstep(27,28,T)*.6);
  $('hud').style.opacity=sstep(21.3,21.9,T);
  if(T>=21.3)setHud(T>=26.3?{d:hudVals.TOT.distance_m,min:hudVals.TOT.min,kcal:hudVals.TOT.kcal}:r);
}

/* ---------- 每格 ---------- */
function render(T){
  const pr=renderer.getPixelRatio();
  dustMat.uniforms.uPx.value=pr*SH/1080*100;brainMat.uniforms.uPx.value=pr*SH;
  if(T<T_SWITCH||!terrMat){updateA(T);renderer.setClearColor(0x000000,1);renderer.render(sA,camA)}
  else{updateB(T);renderer.setClearColor(0x2b1a12,1);renderer.render(sB,camB)}
  // 橘色大氣霧：火星 → 地形的過場；?act=1 時從黑畫面淡入
  const hz=T<T_SWITCH?sstep(7.1,8,T):1-sstep(8,8.9,T);$('haze').style.opacity=ACT1?0:hz;
  const bl=ACT1?1-sstep(8,8.8,T):1-sstep(0,.6,T);$('black').style.opacity=ready?bl:1;
  let cap='',co=0;if(SHOW_CAP)for(const [a,b,s] of CAPS)if(T>=a&&T<=b){cap=s;co=sstep(a,a+.35,T)*(1-sstep(b-.35,b,T))}
  const ce=$('cap');if(ce.textContent!==cap)ce.textContent=cap;ce.style.opacity=co;
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(ready&&playing)T=Math.min(T_END,T+dt);
  if(ready)render(T);
  requestAnimationFrame(frame);
}
addEventListener('keydown',e=>{
  if(e.code==='Space'){playing=!playing;e.preventDefault()}
  else if(e.key==='r'||e.key==='R'){T=T_START;playing=true;last=performance.now()}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
});
window.film={get T(){return T},seek(t){T=clamp(t,0,T_END);render(T)},pause(){playing=false},play(){playing=true},get ready(){return ready}};
resize();
loadTerrain().then(()=>{updateB(12);renderer.render(sB,camB);updateA(3);renderer.render(sA,camA);ready=true;last=performance.now();requestAnimationFrame(frame)}).catch(err=>{console.error('film: data load failed',err)});
</script>
</body>
