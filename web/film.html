     teammate Shooyunn's 3D walk (web/arcadia3d.html): sky + fog, DTM with ortho + class overlay, seeded rocks, ground guide ribbon. Keys: Space pause/resume, R replay, F fullscreen.
     URL: ?t=<s> start time, ?pause=1, ?dpr=1. Frame capture: film.seek(t) after film.ready; film.duration = 15. -->

<style>

<body>
<div id="stage">
  <canvas id="c"></canvas>
  <canvas id="fx"></canvas>
  <div id="flash"></div>
  <div id="dim"></div>
  <div id="place">Arcadia Planitia · 39°N</div>
  <div id="hud"><div id="tag"></div>
    <div class="row"><span class="lab">ENERGY</span><div class="bar"><i id="be"></i></div><b id="hk">0</b><em>/ 1,440 kcal</em><span id="ok">RETURN OK</span></div>
    <div class="row"><span class="lab">O₂</span><div class="bar o2"><i id="bo"></i></div><b id="ho">0</b><em>L</em></div>

  <div id="nav"><div class="compass"><div class="tape" id="tape"></div></div><div id="hdg">000°</div><div id="next"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id),D2R=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const ramp=(a,b,x)=>clamp((x-a)/(b-a),0,1);
const inOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- 時間軸（秒）：B1 0–2.2 拉高 · B2 2.2–5 自走車 · B3 5–9 熱度圖 · B4a 9–10.8 路線計畫 · B4b 10.8–11.5 俯衝切換 · B4c 11.5–15 第一人稱導航 ---------- */
const Q=new URLSearchParams(location.search);
const T_END=15;
let T=Q.has('t')?clamp(+Q.get('t')||0,0,T_END):0,playing=Q.get('pause')!=='1',ready=false;

/* ---------- renderer / 版面 ---------- */
const stage=$('stage'),renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(+(Q.get('dpr')||devicePixelRatio),2));
const cam=new THREE.PerspectiveCamera(40,16/9,1,500000);
const fx=$('fx'),fxc=fx.getContext('2d');
function resize(){const r=stage.getBoundingClientRect();stage.style.setProperty('--u',r.height/100+'px');renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();
  fx.width=Math.round(r.width);fx.height=Math.round(r.height)}
addEventListener('resize',resize);

/* =====================================================================
   Arcadia 真實地形（HiRISE DTM＋正射影像，與 arcadia3d.html 同一份資料）
   ===================================================================== */
const scene=new THREE.Scene();
let ARC,GEO,X0,Y0,WD,GN=373,GS,HGRID,EX=1.5,Cw,T1w,BASEw,RC,ROUTE,TOTD,CUM,TOT,HEAD;
const toXY=([lo,la])=>[(lo-GEO.lon0)*D2R*GEO.R*Math.cos(GEO.lat0*D2R),(la-GEO.lat0)*D2R*GEO.R];
function gridY(x,y){ // 地形網格高度（世界 y），x 東、y 北（區域公尺）
  const u=clamp((x-X0)/GS,0,GN-1.001),v=clamp((y-Y0)/GS,0,GN-1.001),i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,k=j*GN+i,H=HGRID;
  return (H[k]*(1-fu)+H[k+1]*fu)*(1-fv)+(H[k+GN]*(1-fu)+H[k+GN+1]*fu)*fv;
}
const W3=(x,y,lift=0)=>V3(x,gridY(x,y)+lift,-y);

/* 時間與耗能：與 arcadia3d.html 相同（地圖頁卡片的 Pandolf 結果，沿路線每個頂點的累積值） */
function cumFromLegs(legs,stop,P){
  const c={d:[0],tA:[0],tD:[0],kA:[0],kD:[0]};let D0=0,T0=0,K0=0,j=0;
  legs.forEach((L,li)=>{
    const dw=li<legs.length-1?stop.min:0,dk=dw*stop.kcal_per_min,n=L.path.length-1;let s=0;const len=[];
    for(let q=0;q<n;q++){len.push(Math.hypot(P[j+q+1].x-P[j+q].x,P[j+q+1].z-P[j+q].z));s+=len[q]}
    let a=0;for(let q=0;q<n;q++){a+=len[q];const f=s?a/s:1,t=T0+f*(L.min-dw),k=K0+f*(L.kcal-dk);c.d.push(D0+f*L.distance_m);c.tA.push(t);c.tD.push(t);c.kA.push(k);c.kD.push(k)}
    j+=n;D0+=L.distance_m;T0+=L.min;K0+=L.kcal;c.tD[j]=T0;c.kD[j]=K0;
  });
  return c;
}
function routeAt(dd){ // 沿路線距離（卡片的 d）→ 頂點索引內插：位置與累積值
  const C=CUM;dd=clamp(dd,0,TOTD);let i=0;while(i<C.d.length-2&&C.d[i+1]<dd)i++;
  const f=C.d[i+1]>C.d[i]?clamp((dd-C.d[i])/(C.d[i+1]-C.d[i]),0,1):1,a=ROUTE[i],b=ROUTE[i+1];
  return{x:lerp(a[0],b[0],f),y:lerp(a[1],b[1],f),d:dd,min:C.tD[i]+(C.tA[i+1]-C.tD[i])*f,kcal:C.kD[i]+(C.kA[i+1]-C.kD[i])*f};
}

const termVS='varying vec2 vUv;varying vec3 vN;varying float vDist;void main(){vUv=uv;vN=normal;vec4 mv=modelViewMatrix*vec4(position,1.);vDist=length(mv.xyz);gl_Position=projectionMatrix*mv;}';
const FOG='uniform vec3 uFogC;uniform float uFogD;vec3 fogit(vec3 c,float d){return mix(c,uFogC,1.-exp(-uFogD*d));}';
const fogU=()=>({uFogC:{value:new THREE.Color(.86,.62,.44)},uFogD:{value:1/70000}});
let terrMat,roverMat,astroAll,aoiLine,tgtObjs=[],baseGlow;

function ribbonGeo(paths,width,lift){ // paths: [{pts:[[x,y]..], s:[0..1]}]
  const pos=[],aS=[],idx=[];let base=0;
  for(const p of paths){
    const n=p.pts.length;
    for(let k=0;k<n;k++){
      const a=p.pts[Math.max(0,k-1)],b=p.pts[Math.min(n-1,k+1)];let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
      const nx=-ty*width/2,ny=tx*width/2,[x,y]=p.pts[k];
      for(const sg of [-1,1]){const xx=x+nx*sg,yy=y+ny*sg;pos.push(xx,Math.max(gridY(xx,yy),gridY(x,y))+lift,-yy);aS.push(p.s[k])}
      if(k<n-1){const q=base+k*2;idx.push(q,q+1,q+2,q+1,q+3,q+2)}
    }
    base+=n*2;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aS',new THREE.Float32BufferAttribute(aS,1));g.setIndex(idx);return g;
}
function ribbonMat(col,head){ // uT = 0..1 生長進度（所有路徑同時）
  return new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4,
    uniforms:{uT:{value:0},uOp:{value:0},uC:{value:new THREE.Color(col)},uH:{value:new THREE.Color(head)},uGlow:{value:0}},
    vertexShader:'attribute float aS;varying float vS;void main(){vS=aS;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:`uniform float uT,uOp,uGlow;uniform vec3 uC,uH;varying float vS;
    void main(){float p=uT;if(vS>p||p<=0.)discard;float h=(p<1.)?smoothstep(p-.1,p,vS):0.;vec3 c=mix(uC,uH,h)*(1.+h*.6);c=mix(c,vec3(.75,1.,1.),uGlow*.45)*(1.+uGlow*.35);gl_FragColor=vec4(c,uOp);}`});
}
function glowTex(r,g,b){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(255,255,255,1)`);gr.addColorStop(.2,`rgba(${r},${g},${b},.9)`);gr.addColorStop(.5,`rgba(${r},${g},${b},.22)`);gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const imgData=img=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);return x.getImageData(0,0,c.width,c.height)};
const loadImg=u=>new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=u});

async function loadTerrain(){
  const tl=new THREE.TextureLoader(),tex=u=>new Promise((ok,bad)=>tl.load(u,ok,undefined,bad));
  ARC=await (await fetch('data/arcadia/arcadia.json')).json();
  const ctx=await fetch('data/arcadia/context.json').then(r=>r.ok?r.json():null).catch(()=>null);
  GEO=ARC.geo;[X0,Y0]=[ARC.aoi_local_m[0],ARC.aoi_local_m[1]];WD=ARC.aoi_local_m[2]-X0;GS=WD/(GN-1);
  const [tif,ortho,layImg,clsImg,themis]=await Promise.all([
    fetch('data/arcadia/walk3d_dtm.tif').then(r=>r.arrayBuffer()),tex('data/arcadia/walk3d_ortho.jpg'),loadImg('data/film/film_layers.png'),loadImg('data/arcadia/classes.png'),
    ctx?.trek?tex('data/arcadia/'+ctx.trek.file):Promise.resolve(null),
    ...['500','600'].map(w=>document.fonts.load(w+' 40px "Barlow Semi Condensed"').catch(()=>null))]);
  // DTM（同 arcadia3d.html：缺值往前補）
  const im=await(await GeoTIFF.fromArrayBuffer(tif)).getImage(),[minX,,maxX,maxY]=im.getBoundingBox(),nx=im.getWidth(),ny=im.getHeight(),nd=im.getGDALNoData();
  const raw=await im.readRasters({interleave:true,samples:[0]}),dem=new Float32Array(nx*ny),ok=v=>Number.isFinite(v)&&v!==nd&&v>-1e5;
  let sum=0,cnt=0;for(let i=0;i<dem.length;i++)if(ok(raw[i])){sum+=raw[i];cnt++}
  const mean=cnt?sum/cnt:0;let last=mean;for(let i=0;i<dem.length;i++){if(ok(raw[i]))last=raw[i];dem[i]=last}
  const rx=(maxX-minX)/nx;
  const demAt=(x,y)=>{const u=clamp((x-minX)/rx-.5,0,nx-1.001),v=clamp((maxY-y)/rx-.5,0,ny-1.001),i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,k=j*nx+i;
    return (dem[k]*(1-fu)+dem[k+1]*fu)*(1-fv)+(dem[k+nx]*(1-fu)+dem[k+nx+1]*fu)*fv};
  DEMAT=demAt;DMEAN=mean;
  HGRID=new Float32Array(GN*GN);
  const pos=new Float32Array(GN*GN*3),uv=new Float32Array(GN*GN*2),idx=[];
  for(let j=0;j<GN;j++)for(let i=0;i<GN;i++){
    const x=X0+i*GS,y=Y0+j*GS,e=Math.min(x-X0,X0+WD-x,y-Y0,Y0+WD-y),w=sstep(0,160,e),h=(demAt(x,y)-mean)*EX*w,k=j*GN+i;
    HGRID[k]=h;pos.set([x,h,-y],k*3);uv.set([i/(GN-1),j/(GN-1)],k*2);
    if(i<GN-1&&j<GN-1)idx.push(k,k+1,k+GN,k+1,k+GN+1,k+GN);
  }
  const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(pos,3));tg.setAttribute('uv',new THREE.BufferAttribute(uv,2));tg.setIndex(idx);tg.computeVertexNormals();
  // 影片用圖層（tools/film_layers.py）：R＝腦紋分數、G＝自走車看到該格的路徑進度（255＝沒看過）；列 0＝北
  const ld=imgData(layImg),lay=new THREE.DataTexture(new Uint8Array(ld.data.buffer),ld.width,ld.height,THREE.RGBAFormat);
  lay.magFilter=lay.minFilter=THREE.LinearFilter;lay.generateMipmaps=false;lay.needsUpdate=true;
  ortho.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const bxy=ARC.base_xy;
  terrMat=new THREE.ShaderMaterial({uniforms:{tO:{value:ortho},tL:{value:lay},uRev:{value:0},uVeil:{value:0},uHeat:{value:0},uFront:{value:0},
      uBase:{value:new THREE.Vector2((bxy[0]-X0)/WD,(bxy[1]-Y0)/WD)},uWD:{value:WD},uSun:{value:V3(-.55,.62,-.35).normalize()},...fogU()},
    vertexShader:termVS,fragmentShader:FOG+`uniform sampler2D tO,tL;uniform float uRev,uVeil,uHeat,uFront,uWD;uniform vec2 uBase;uniform vec3 uSun;varying vec2 vUv;varying vec3 vN;varying float vDist;
    vec3 heatC(float v){ // 暗紅 → 橘 → 亮黃白
      vec3 c=mix(vec3(.28,.02,.02),vec3(.78,.09,.03),smoothstep(0.,.45,v));
      c=mix(c,vec3(1.,.45,.05),smoothstep(.4,.78,v));return mix(c,vec3(1.,.94,.72),smoothstep(.8,1.,v));}
    void main(){float g=texture2D(tO,vUv).r;vec3 c=vec3(1.,.72,.52)*(.22+1.05*g);c*=.62+.55*max(dot(normalize(vN),uSun),0.);
      vec4 L=texture2D(tL,vec2(vUv.x,1.-vUv.y));
      float rv=L.g*255.,P=uRev*250.,seen=1.-smoothstep(P-8.,P,rv);
      c*=1.-uVeil*(1.-seen)*.62;
      float sc=(L.r*255.-1.)/254.,v=clamp((sc-.45)/.5,0.,1.),has=step(.5/255.,L.r);
      float r=length(vUv-uBase)*uWD,fr=1.-smoothstep(uFront-350.,uFront,r);
      float a=has*uHeat*fr*mix(.18,.9,smoothstep(0.,.7,v));
      vec3 hc=heatC(v)*(1.+.25*smoothstep(.85,1.,v));
      c=mix(c,hc,a);gl_FragColor=vec4(fogit(c,vDist),1.);}`});
  scene.add(new THREE.Mesh(tg,terrMat));
  // 外圍：Mars Trek THEMIS 日間紅外線鑲嵌圖（同首頁）
  if(themis&&ctx?.trek){
    const cs=ctx.trek.coordinates.map(toXY),xa=cs[0][0],xb=cs[1][0],ya=cs[2][1],yb=cs[0][1];
    const pg=new THREE.PlaneGeometry(xb-xa,yb-ya,1,1);pg.rotateX(-Math.PI/2);
    const cm=new THREE.ShaderMaterial({depthWrite:false,uniforms:{t:{value:themis},...fogU()},vertexShader:termVS,
      fragmentShader:FOG+'uniform sampler2D t;varying vec2 vUv;varying vec3 vN;varying float vDist;void main(){float g=texture2D(t,vUv).r;gl_FragColor=vec4(fogit(vec3(1.,.7,.5)*(.02+1.05*g),vDist),1.);}'});
    const m=new THREE.Mesh(pg,cm);m.renderOrder=-1;m.position.set((xa+xb)/2,-1.5,-(ya+yb)/2);scene.add(m);
  }
  Cw=W3(X0+WD/2,Y0+WD/2);BASEw=W3(bxy[0],bxy[1]);
  // 分析區外框
  const sq=[[X0,Y0],[X0+WD,Y0],[X0+WD,Y0+WD],[X0,Y0+WD],[X0,Y0]];
  aoiLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(sq.map(([x,y])=>W3(x,y,6))),new THREE.LineBasicMaterial({color:0xf2b36b,transparent:true,opacity:0}));scene.add(aoiLine);
  // 自走車 24 趟（同時生長）
  const rp=ARC.rover.loops.map(L=>{const pts=L.path.map(toXY);let a=0;const s=[0];for(let k=1;k<pts.length;k++){a+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);s.push(a)}
    return{pts,s:s.map(v=>v/(a||1))}});
  roverMat=ribbonMat(0x3d8dff,0xe8f4ff);scene.add(new THREE.Mesh(ribbonGeo(rp,15,3),roverMat));
  baseGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(225,240,255),blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,transparent:true,opacity:0}));
  baseGlow.position.copy(W3(bxy[0],bxy[1],12));baseGlow.renderOrder=10;scene.add(baseGlow);
  // 12 個高分區域：細光柱＋圓環（選中的 5 個另有實心圓）

    const a=hash(i,1)*Math.PI*2,sp=.7+hash(i,2)*.8,p=(hash(i,3)+(t-DIVE0)*1.8*sp)%1,r0=Rr*(.18+.85*p),len=Rr*(.04+.22*p)*k;

    fxc.beginPath();fxc.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);fxc.lineTo(cx+Math.cos(a)*(r0+len),cy+Math.sin(a)*(r0+len));fxc.stroke();
  }
}
function render(t){
  const fp=t>=T_SW,c=camAt(t);applyP(c);
  cam.fov=lerp(40,64,sstep(10.9,FP_T0,t));
  if(fp){cam.near=.1;cam.far=3000}else{const h=cam.position.y-c.q.y;cam.near=clamp(h*.02,.5,200);cam.far=400000}
  cam.updateProjectionMatrix();
  if(!fp){
    const U=terrMat.uniforms;
    // B1：未探索遮罩淡入；B2：自走車同時生長、遮罩跟著打開；B3：遮罩淡出
    const rev=sstep(2.4,4.6,t);
    U.uVeil.value=sstep(.5,2.0,t)*(1-sstep(5,6,t));U.uRev.value=rev;
    roverMat.uniforms.uT.value=rev;roverMat.uniforms.uOp.value=sstep(2.35,2.6,t)*lerp(1,.25,sstep(5,6,t))*(1-sstep(9,9.4,t));
    aoiLine.material.opacity=.7*sstep(1.1,2.0,t)*(1-sstep(5,6,t));
    // B3：熱度圖以基地為中心擴散 → 8.2–9.0 淡出
    U.uHeat.value=t<5?0:1-sstep(8.2,9.0,t);U.uFront.value=lerp(0,3600,ramp(5,6,t));
    const pop=sstep(6,6.6,t),dimR=1-.55*sstep(8.2,9,t);
    for(const o of tgtObjs){
      const sel=sstep(9.1,9.6,t),on=o.onRoute;
      let ro=.95*pop*dimR;if(t>9)ro=lerp(ro,on?1:.25,sel);
      o.rm.opacity=ro;o.ring.scale.setScalar(1+.5*(1-pop));
      o.dm.opacity=on?.55*sel:0;
      o.pm.uniforms.uOp.value=.85*sstep(6,6.5,t)*(1-sstep(7,7.6,t));
    }
    // B4a：路線從基地畫出
    astroAll.uniforms.uT.value=inOut(ramp(9.1,9.9,t));astroAll.uniforms.uOp.value=sstep(9,9.2,t)*(1-.6*sstep(10.95,11.25,t));
    baseGlow.scale.setScalar(cam.position.distanceTo(baseGlow.position)*.05);baseGlow.material.opacity=sstep(2.2,2.5,t);
  }else{fpSky.position.copy(cam.position);FR.rmat.uniforms.uTime.value=t;updateRibbon(walkD(t))}
  // 畫面文字與轉場
  $('place').style.opacity=sstep(0,.3,t)*(1-sstep(1.6,2.0,t));
  setHud(t);setNav(t);drawFx(t);
  $('flash').style.opacity=(.92*Math.exp(-Math.pow((t-T_SW)/.07,2))).toFixed(3);
  $('dim').style.opacity=.65*sstep(14.4,15,t);
  renderer.render(fp?sF:scene,cam);
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(playing)T=Math.min(T_END,T+dt);
  render(T);
  requestAnimationFrame(frame);
}
addEventListener('keydown',e=>{
  if(e.code==='Space'){playing=!playing;e.preventDefault()}
  else if(e.key==='r'||e.key==='R'){T=0;playing=true;last=performance.now()}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
});
window.film={duration:T_END,get T(){return T},seek(t){T=clamp(t,0,T_END);if(ready)render(T)},pause(){playing=false},play(){playing=true},get ready(){return ready}};
resize();
renderer.setClearColor(0xd3a47c,1);   // 低角度俯衝時看到的遠方＝第一人稱天空的地平線色
loadTerrain().then(()=>{render(12);render(10);render(T);ready=true;last=performance.now();requestAnimationFrame(frame)}).catch(err=>{console.error('film: data load failed',err)});
</script>
