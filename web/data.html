<body>
<header id="top">
  <a class="brand" href="jezero.html"><span class="logo">&#9679;</span> Marswalk Recon <span class="muted" data-i18n="nav.place">· Jezero Crater</span></a>
  <nav id="pages" aria-label="Pages">
    <a class="btn" href="jezero.html" data-i18n="nav.astro">Astronaut map</a>
    <a class="btn" href="recon.html" data-i18n="nav.recon">Step 1 · Scout rover recon</a>
    <a class="btn active" href="data.html" aria-current="page" data-i18n="nav.data">Map data</a>
    <a class="btn demo" href="scratch/" data-i18n="nav.demo">Interactive demo</a>
  </nav>
  <div class="actions">
    <button id="aboutBtn" class="btn" data-i18n="common.aboutBtn">About &amp; Limitations</button>
  </div>
</header>
<div id="skelBanner" role="note"><span data-i18n="dt.question">Which Mars maps do we use, and what does the sharp HiRISE terrain show that the coarse CTX terrain does not?</span> <span class="pending" id="reviewTag"></span></div>
<main>
  <aside id="panel" aria-label="Layers">
    <nav id="scenes" aria-label="Scenes" hidden></nav>
    <section id="sceneInfo"></section>
    <section>
      <h3 data-i18n="dt.cmpH">Compare terrain resolution</h3>
      <div class="presets">
        <button class="btn sm" data-preset="ref" data-i18n="dt.pRef">HiRISE (sharp)</button>
        <button class="btn sm" data-preset="prior" data-i18n="dt.pPrior">CTX (coarse)</button>
        <button class="btn sm" data-preset="swipe" id="swipeBtn" data-i18n="dt.pSwipe">Swipe</button>
      </div>
    </section>
    <section id="layers"></section>
    <section><details id="checksBox"><summary data-i18n="dt.checksSum">Positioning checks</summary><div id="checks"></div></details></section>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="map2"></div>
    <div id="swipeHandle" hidden><span data-i18n="dt.swipeLbl">HiRISE ◀ ▶ CTX</span></div>
    <div id="scale"><div id="scaleBar"></div><span id="scaleLabel"></span></div>
    <div id="coords"></div>
  </div>
  <aside id="photoPanel" hidden aria-label="Ground photos">
    <button id="photoClose" class="btn sm close" aria-label="Close">✕</button>
    <div id="photoBody"></div>
  </aside>
</main>
<dialog id="about">
  <form method="dialog"><button class="btn sm close" aria-label="Close">✕</button></form>
  <div id="aboutBody"></div>
</dialog>
