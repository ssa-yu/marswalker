# Publishes web/ (the Arcadia demo) to GitHub Pages. Needs: Settings -> Pages -> Source = "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the judges' site is the Arcadia demo only: leave the earlier Jezero pages and data out of the upload
      - run: |
          cp -r web _site
          rm -rf _site/data/jezero _site/scratch
          rm -f _site/jezero.html _site/recon.* _site/astronaut.* _site/data.html _site/app.js _site/step2.js _site/i18n.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
